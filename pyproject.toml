[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "walmart-ml"
version = "0.1.0"
description = "Weekly Walmart sales forecasting with an Azure ML CI/CD pipeline."
readme = "README.md"
requires-python = ">=3.10"
# Base install: enough for the pipeline CLI scripts that only read CSVs.
# The heavier stacks are optional extras, so CI jobs install only what they use.
dependencies = [
    "pandas==2.2.2",
    "numpy==1.26.4",
]

[project.optional-dependencies]
# Model training (walmart_ml.training).
train = [
    "scikit-learn==1.5.2",
    # xgboost and mlflow versions are tied to Azure ML MLflow support:
    # https://learn.microsoft.com/en-us/azure/machine-learning/how-to-log-mlflow-models
    "xgboost==2.1.1",
    "mlflow==2.16.2",
    "matplotlib==3.9.2",
]
# Endpoint scoring scripts (walmart_ml.scoring).
scoring = [
    "xgboost==2.1.1",
    "azure-ai-ml==1.32.0",
    # Matches the endpoint image: azureml-dataprep 5.5.0 (via azureml-fsspec)
    # requires azure-identity<=1.17.0.
    "azure-identity==1.17.0",
    # Matches the endpoint image: azureml-fsspec 1.4.0 requires fsspec<=2023.10.0.
    "fsspec==2023.10.0",
]
# Feature-store materialization and Delta table reads (walmart_ml.pipeline).
spark = [
    "pyspark==3.5.3",
    "delta-spark==3.2.1",
    "pyarrow==17.0.0",
    # Provides the distutils shim PySpark 3.5 needs on Python 3.12.
    "setuptools==84.2.1",
]
# Locust load test against the real-time endpoint.
loadtest = [
    "locust==2.47.0",
]
all = [
    "walmart-ml[train,scoring,spark,loadtest]",
]
# Everything plus test and lint tools, for local development and CI checks.
dev = [
    "walmart-ml[all]",
    "pytest==8.3.3",
    "pytest-cov==6.0.0",
    "pytest-mock==3.14.0",
    "pylint==4.1.3",
    "mypy==1.13.0",
]

[tool.setuptools.packages.find]
where = ["src"]

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
# Lets tests run without installing the package; harmless with pip install -e.
pythonpath = ["src"]
testpaths = ["tests"]
# Capture INFO log records so tests can assert on them with caplog.
log_level = "INFO"
filterwarnings = [
    "ignore::marshmallow.warnings.RemovedInMarshmallow4Warning",
    "ignore::marshmallow.warnings.ChangedInMarshmallow4Warning",
    'ignore:Type google\._upb\._message\..*:DeprecationWarning',
    'ignore:distutils Version classes are deprecated.*:DeprecationWarning:pyspark\.sql\.pandas\.utils',
    "ignore:.*Saving model in the UBJSON format as default.*:UserWarning",
]
markers = [
    "integration: tests that exercise multiple components together",
]

# ---------------------------------------------------------------- pylint
[tool.pylint.main]
ignore = ["venv", "env", ".venv"]
extension-pkg-allow-list = ["numpy", "pandas", "matplotlib", "xgboost"]

[tool.pylint."messages control"]
disable = [
    # Functions with many parameters take them as keyword-only arguments,
    # so call sites stay readable.
    "too-many-arguments",          # R0913
    "invalid-name",                # C0103, allows ML names like X_train and y_test
    "no-member",                   # E1101, false positives with numpy/pandas
]

[tool.pylint.format]
max-line-length = 120

[tool.pylint.reports]
output-format = "text"
score = true

[tool.pylint.typecheck]
ignored-modules = ["numpy", "pandas", "matplotlib", "xgboost", "sklearn"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["walmart_ml"]
# Every function must be fully annotated, and annotated code is checked.
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true
strict_equality = true

# Third-party libraries without bundled type information.
[[tool.mypy.overrides]]
module = [
    "azure.*",
    "delta.*",
    "fsspec.*",
    "locust.*",
    "matplotlib.*",
    "mlflow.*",
    "pandas.*",
    "py4j.*",
    "pyspark.*",
    "sklearn.*",
    "xgboost.*",
]
ignore_missing_imports = true
