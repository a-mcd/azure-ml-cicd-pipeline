####
# Builds a canidate model, compares it to the champion model and deploys it if it is better
####
name:  Walmart Test Pipeline

on:

  # push:
  #   branches: ["**"]
  # pull_request:
  #   branches: ["**"]
  workflow_dispatch:
    inputs:
      # TEMPORARY: lets a run resume at deployment after a failure.
      deploy_model_version:
        description: "Deploy this registered walmart-xgb version and skip training (leave empty for a normal run)"
        required: false
        default: ""
        type: string

env:
  STORAGE_TYPE: "${{ vars.TEST_STORAGE_TYPE }}"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  MPLBACKEND: Agg
  RG: "${{ vars.TEST_PREFIX }}-rg"
  WORKSPACE_NAME: "${{ vars.TEST_PREFIX }}_workspace"

  FEATURE_STORE_WS: "${{ vars.TEST_PREFIX }}_fs_ws"
  FEATURE_SET_NAME: walmart_sales_features
  FEATURE_SET_VERSION: "1"
  FEATURE_DATA_ASSET_NAME: "walmart_materialized_features"

  TRAINING_ENVIRONMENT: "${{ vars.TEST_PREFIX }}-training-env:${{ vars.TEST_TRAINING_ENV_VERSION }}"
  ENDPOINT_ENVIRONMENT: "${{ vars.TEST_PREFIX }}-endpoint-env:${{ vars.TEST_ENDPOINT_ENV_VERSION }}"

  RT_ENDPOINT_PREFIX: "rt-walmart-sales-"
  BATCH_ENDPOINT_PREFIX: "batch-walmart-sales"
  DATALAKE_ASSET_PATH: "walmart-sales/current/walmart_sales.csv"
  DATALAKE_ASSET_URI: "azureml://datastores/walmart_datalake/paths/walmart-sales/current/walmart_sales.csv"
  BLOBSTORAGE_ASSET_URL: "azureml:walmart_sales_dataset@latest"

  MODEL_NAME: "walmart-xgb"

  PYTHON_VERSION: "3.12"
  ARTIFACT_RETENTION_DAYS: 30

  # Longest an Azure ML job may run before the workflow cancels it.
  # Each waiting step also has a GitHub timeout-minutes 15 minutes longer.
  AML_JOB_TIMEOUT_MINUTES: 60

jobs:
  pylint:
    name: Run Pylint and mypy Stage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python and install walmart_ml
        uses: ./.github/actions/python-setup
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          extras: "dev"

      - name: Run Pylint
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p reports

          echo "::group::Run Pylint checks"

          set +e
          pylint \
            --fail-under=10.0 \
            src \
            2>&1 | tee reports/pylint-report.txt

          PYLINT_EXIT_CODE="${PIPESTATUS[0]}"
          set -e

          echo "::endgroup::"

          PYLINT_SCORE="$(
            sed -n \
              's/.*rated at \([-0-9.]*\)\/10.*/\1/p' \
              reports/pylint-report.txt |
            tail -n 1
          )"

          if [[ -z "$PYLINT_SCORE" ]]; then
            PYLINT_SCORE="unknown"
          fi

          {
            echo "## Pylint"
            echo
            echo "- Score: \`${PYLINT_SCORE}/10\`"
            echo "- Required score: \`10.0/10\`"
            echo "- Exit code: \`$PYLINT_EXIT_CODE\`"

            echo "## Generated reports"
            echo
            echo "| Report | Artifact | Retention |"
            echo "|---|---|---:|"
            echo "| Pylint report | \`pylint-report-${{ github.run_id }}\` | 30 days |"
            echo
            echo "Report file: \`reports/pylint-report.txt\`"
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "$PYLINT_EXIT_CODE" -ne 0 ]]; then
            echo "::error title=Pylint failed::Score ${PYLINT_SCORE}/10; required 10.0/10"
          fi

          exit "$PYLINT_EXIT_CODE"

      - name: Run mypy
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports

          # Settings (strict function annotations, per-library import rules)
          # are in pyproject.toml under [tool.mypy].
          set +e
          mypy 2>&1 | tee reports/mypy-report.txt
          MYPY_EXIT_CODE="${PIPESTATUS[0]}"
          set -e

          if [[ "$MYPY_EXIT_CODE" -eq 0 ]]; then
            echo "## mypy: no type errors" >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "## mypy: type errors found"
              echo
              echo '```'
              tail -n 30 reports/mypy-report.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=mypy failed::Type errors found; see reports/mypy-report.txt"
          fi

          exit "$MYPY_EXIT_CODE"

      - name: Upload Pylint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pylint-report-${{ github.run_id }}
          path: reports/
          if-no-files-found: warn
          retention-days: ${{ fromJSON(env.ARTIFACT_RETENTION_DAYS) }}

  code-tests:
    name: Unit/Integration Tests Stage
    runs-on: ubuntu-latest
    env:
      TEST_COVERAGE_THRESHOLD: 98
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python and install walmart_ml
        uses: ./.github/actions/python-setup
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          extras: "dev"

      - name: Run unit and integration tests
        run: .github/scripts/run-tests.sh

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: reports/
          if-no-files-found: warn
          retention-days: ${{ fromJSON(env.ARTIFACT_RETENTION_DAYS) }}

  get-endpoint-names:
    name: Retrieve endpoint names
    runs-on: ubuntu-latest
    needs: [code-tests, pylint]
    if: ${{ success() && github.ref == 'refs/heads/main' }}
    outputs:
      rt_endpoint_name: ${{ steps.get-rt-endpoint.outputs.name }}
      batch_endpoint_name: ${{ steps.get-batch-endpoint.outputs.name }}
    steps:
      - name: Check out workflow actions and scripts
        uses: actions/checkout@v6
        with:
          sparse-checkout: .github

      - name: Set up Azure CLI
        uses: ./.github/actions/azure-setup
        with:
          creds: ${{ secrets.TEST_AZURE_SECRET }}

      - name: Find real-time endpoint
        id: get-rt-endpoint
        uses: ./.github/actions/find-endpoint
        with:
          type: online
          prefix: ${{ env.RT_ENDPOINT_PREFIX }}
          resource-group: ${{ env.RG }}
          workspace-name: ${{ env.WORKSPACE_NAME }}

      - name: Find batch endpoint
        id: get-batch-endpoint
        uses: ./.github/actions/find-endpoint
        with:
          type: batch
          prefix: ${{ env.BATCH_ENDPOINT_PREFIX }}
          resource-group: ${{ env.RG }}
          workspace-name: ${{ env.WORKSPACE_NAME }}

      - name: Write endpoint summary
        shell: bash
        env:
          RT_ENDPOINT_NAME: ${{ steps.get-rt-endpoint.outputs.name }}
          BATCH_ENDPOINT_NAME: ${{ steps.get-batch-endpoint.outputs.name }}
        run: |
          set -euo pipefail
          {
            echo "## Resolved Azure ML endpoints"
            echo
            echo "| Endpoint type | Name |"
            echo "|---|---|"
            echo "| Real-time | \`$RT_ENDPOINT_NAME\` |"
            echo "| Batch | \`$BATCH_ENDPOINT_NAME\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  retrieve-last-date:
    name: Get the last materialized date
    needs: [code-tests, pylint]
    runs-on: ubuntu-latest
    outputs:
      latestdate: ${{ steps.get-last-processed-date.outputs.latest-processed-date }}
    steps:

      - uses: actions/checkout@v6

      - name: Set up Azure CLI
        uses: ./.github/actions/azure-setup
        with:
          creds: ${{ secrets.TEST_AZURE_SECRET }}

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python and install walmart_ml
        uses: ./.github/actions/python-setup
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          extras: "all"
          verify-spark: "true"

      - name: Discover feature-store storage
        if: ${{ vars.BACKFILL_WORKING != 'false' }}
        id: feature-store-storage
        shell: bash
        run: |
          set -euo pipefail

          echo "::group::Discover feature-store storage"

          SUBSCRIPTION_ID="$(
            az account show \
              --query id \
              --output tsv
          )"

          if [[ -z "$SUBSCRIPTION_ID" ||
                "$SUBSCRIPTION_ID" == "null" ]]; then
            echo "::endgroup::"
            echo "::error title=Subscription unresolved::Could not determine the current Azure subscription ID"
            exit 1
          fi

          FEATURE_STORE_ID="/subscriptions/${SUBSCRIPTION_ID}/resourceGroups/${RG}/providers/Microsoft.MachineLearningServices/workspaces/${FEATURE_STORE_WS}"

          FEATURE_STORE_STORAGE_ID="$(
            az resource show \
              --ids "$FEATURE_STORE_ID" \
              --query properties.storageAccount \
              --output tsv
          )"

          if [[ -z "$FEATURE_STORE_STORAGE_ID" ||
                "$FEATURE_STORE_STORAGE_ID" == "null" ]]; then
            echo "::endgroup::"
            echo "::error title=Feature-store storage unresolved::Could not determine the storage account for feature store '$FEATURE_STORE_WS'"
            exit 1
          fi

          OFFLINE_STORE_SCOPE="$(
            az ml feature-store show \
              --name "$FEATURE_STORE_WS" \
              --resource-group "$RG" \
              --query offline_store.target \
              --output tsv
          )"

          if [[ -z "$OFFLINE_STORE_SCOPE" ||
                "$OFFLINE_STORE_SCOPE" == "null" ]]; then
            echo "::endgroup::"
            echo "::error title=Offline store unresolved::Could not determine the offline-store container for feature store '$FEATURE_STORE_WS'"
            exit 1
          fi

          OFFLINE_STORAGE_ACCOUNT="${FEATURE_STORE_STORAGE_ID##*/}"
          OFFLINE_STORAGE_CONTAINER="${OFFLINE_STORE_SCOPE##*/}"

          echo "Storage account: $OFFLINE_STORAGE_ACCOUNT"
          echo "Container:       $OFFLINE_STORAGE_CONTAINER"
          echo "::endgroup::"

          {
            echo "offline-storage-account=$OFFLINE_STORAGE_ACCOUNT"
            echo "offline-storage-container=$OFFLINE_STORAGE_CONTAINER"
          } >> "$GITHUB_OUTPUT"

      - name: Read latest materialized date
        if: ${{ vars.BACKFILL_WORKING != 'false' }}
        shell: bash
        env:
          OFFLINE_STORAGE_ACCOUNT: ${{ steps.feature-store-storage.outputs.offline-storage-account }}
          OFFLINE_STORAGE_CONTAINER: ${{ steps.feature-store-storage.outputs.offline-storage-container }}
        run: |
          set -euo pipefail

          echo "::group::Authenticate to offline feature store"

          AZURE_STORAGE_KEY="$(
            az storage account keys list \
              --resource-group "$RG" \
              --account-name "$OFFLINE_STORAGE_ACCOUNT" \
              --query "[0].value" \
              --output tsv
          )"

          if [[ -z "$AZURE_STORAGE_KEY" ||
                "$AZURE_STORAGE_KEY" == "null" ]]; then
            echo "::endgroup::"
            echo "::error title=Storage authentication failed::Could not retrieve a key for storage account '$OFFLINE_STORAGE_ACCOUNT'"
            exit 1
          fi

          echo "::add-mask::$AZURE_STORAGE_KEY"
          export AZURE_STORAGE_KEY

          echo "Offline feature-store authentication configured."
          echo "::endgroup::"

          echo "::group::Read latest materialized date"
          python src/walmart_ml/pipeline/get_latest_materialized_date.py \
            --github-env
          echo "::endgroup::"

      - name: Read latest date from engineered-features data asset
        if: ${{ vars.BACKFILL_WORKING == 'false' }}
        shell: bash
        run: |
          set -euo pipefail

          # No feature store in this environment (env_setup.sh
          # --backfill-working false). Use the latest version of the data
          # asset the endpoints are deployed with.
          echo "::group::Resolve ${FEATURE_DATA_ASSET_NAME}@latest"
          FEATURE_DATA_VERSION="$(
            az ml data show \
              --name "$FEATURE_DATA_ASSET_NAME" \
              --label latest \
              --resource-group "$RG" \
              --workspace-name "$WORKSPACE_NAME" \
              --query version \
              --output tsv
          )"
          FEATURE_DATA_PATH="$(
            az ml data show \
              --name "$FEATURE_DATA_ASSET_NAME" \
              --version "$FEATURE_DATA_VERSION" \
              --resource-group "$RG" \
              --workspace-name "$WORKSPACE_NAME" \
              --query path \
              --output tsv
          )"

          if [[ -z "$FEATURE_DATA_PATH" || "$FEATURE_DATA_PATH" == "null" ]]; then
            echo "::endgroup::"
            echo "::error title=Missing feature data::Could not resolve ${FEATURE_DATA_ASSET_NAME}@latest"
            exit 1
          fi

          DATASTORE_NAME="workspaceblobstore"
          BLOB_NAME="${FEATURE_DATA_PATH#*/paths/}"
          STORAGE_ACCOUNT_NAME="$(
            az ml datastore show \
              --name "$DATASTORE_NAME" \
              --resource-group "$RG" \
              --workspace-name "$WORKSPACE_NAME" \
              --query account_name \
              --output tsv
          )"
          CONTAINER_NAME="$(
            az ml datastore show \
              --name "$DATASTORE_NAME" \
              --resource-group "$RG" \
              --workspace-name "$WORKSPACE_NAME" \
              --query container_name \
              --output tsv
          )"

          echo "Version: $FEATURE_DATA_VERSION"
          echo "Blob:    $BLOB_NAME"
          echo "::endgroup::"

          echo "::group::Download and read latest date"
          LOCAL_FILE="${RUNNER_TEMP}/walmart_materialized_features_all_weeks.csv"
          az storage blob download \
            --account-name "$STORAGE_ACCOUNT_NAME" \
            --container-name "$CONTAINER_NAME" \
            --name "$BLOB_NAME" \
            --file "$LOCAL_FILE" \
            --overwrite true \
            --only-show-errors \
            --output none

          test -s "$LOCAL_FILE" || {
            echo "::endgroup::"
            echo "::error title=Download failed::The engineered-features CSV is missing or empty"
            exit 1
          }

          # Writes LATEST_DATE to GITHUB_ENV for the next step.
          python src/walmart_ml/pipeline/get_latest_date_csv.py \
            --file "$LOCAL_FILE" \
            --github_env
          echo "FEATURE_DATA_VERSION=$FEATURE_DATA_VERSION" >> "$GITHUB_ENV"
          echo "::endgroup::"

      - name: Validate and publish last processed date
        id: get-last-processed-date
        shell: bash
        env:
          BACKFILL_WORKING: ${{ vars.BACKFILL_WORKING }}
        run: |
          set -euo pipefail

          # The feature-store step sets LATEST_PROCESSED_DATE; the
          # data-asset step (BACKFILL_WORKING=false) sets LATEST_DATE.
          LATEST_PROCESSED_DATE="${LATEST_PROCESSED_DATE:-${LATEST_DATE:-}}"

          if [[ -z "$LATEST_PROCESSED_DATE" ]]; then
            echo "::error title=Latest date missing::Neither the feature store nor the engineered-features data asset produced a latest date"
            exit 1
          fi

          if ! python - "$LATEST_PROCESSED_DATE" <<'PYTHON'
          from datetime import datetime
          import sys

          datetime.strptime(sys.argv[1], "%d-%m-%Y")
          PYTHON
          then
            echo "::error title=Invalid materialized date::Expected DD-MM-YYYY but received '$LATEST_PROCESSED_DATE'"
            exit 1
          fi

          echo "latest-processed-date=$LATEST_PROCESSED_DATE" \
            >> "$GITHUB_OUTPUT"

          if [[ "${BACKFILL_WORKING:-}" == "false" ]]; then
            {
              echo "## Latest engineered-feature date"
              echo
              echo "- Source: \`${FEATURE_DATA_ASSET_NAME}:${FEATURE_DATA_VERSION}\` (no feature store)"
              echo "- Latest date: \`$LATEST_PROCESSED_DATE\`"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "## Feature-store materialization"
              echo
              echo "- Feature store: \`$FEATURE_STORE_WS\`"
              echo "- Feature set: \`${FEATURE_SET_NAME}:${FEATURE_SET_VERSION}\`"
              echo "- Latest materialized date: \`$LATEST_PROCESSED_DATE\`"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  train-models:
    name: Train models and validate
    runs-on: ubuntu-latest
    needs: [code-tests, pylint]
    if: ${{ success() && github.ref == 'refs/heads/main' && inputs.deploy_model_version == '' }}
    env:
      JOB_YAML: azureml/job.yaml
      EXPERIMENT_NAME: "${{ vars.TEST_PREFIX }}_candidate_experiment"
      R2_MIN: 0.90
      MAPE_MAX: 10
      MAE_MAX: 100000
      RMSE_RATIO_MAX: 2.0
    strategy:
      fail-fast: false
      matrix:
        cfg:
          - { iteration: 1, eta: 0.10, max_depth: 8, n_estimators: 900, subsample: 0.8, colsample_bytree: 0.8, reg_alpha: 0.0, reg_lambda: 1.0 }
          - { iteration: 2, eta: 0.05, max_depth: 10, n_estimators: 1400, subsample: 0.8, colsample_bytree: 0.8, reg_alpha: 0.5, reg_lambda: 3.0 }
    steps:
      - uses: actions/checkout@v6

      - name: Set up Azure CLI
        uses: ./.github/actions/azure-setup
        with:
          creds: ${{ secrets.TEST_AZURE_SECRET }}

      - name: Set up Python and install walmart_ml
        uses: ./.github/actions/python-setup
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          extras: "all"

      - name: Render Azure ML job YAML from template
        env:
          ITER: ${{ matrix.cfg.iteration }}
          ETA: ${{ matrix.cfg.eta }}
          MAX_DEPTH: ${{ matrix.cfg.max_depth }}
          N_ESTIMATORS: ${{ matrix.cfg.n_estimators }}
          SUBSAMPLE: ${{ matrix.cfg.subsample }}
          COLSAMPLE_BYTREE: ${{ matrix.cfg.colsample_bytree }}
          REG_ALPHA: ${{ matrix.cfg.reg_alpha }}
          REG_LAMBDA: ${{ matrix.cfg.reg_lambda }}
          SCRIPT_NAME: "train"
          COMPUTE_NAME: "${{ vars.TEST_PREFIX }}-compute"
          DESCRIPTION: "Walmart Sales Prediction job ${{ matrix.cfg.iteration }}"
          CHALLENGER_MODEL: ""
        run: |
          set -euo pipefail
          echo "::group::Candidate $ITER configuration"
          echo "ITER=$ITER" >> $GITHUB_ENV
          echo "ETA=$ETA" >> $GITHUB_ENV
          echo "MAX_DEPTH=$MAX_DEPTH" >> $GITHUB_ENV
          echo "N_ESTIMATORS=$N_ESTIMATORS" >> $GITHUB_ENV
          echo "SUBSAMPLE=$SUBSAMPLE" >> $GITHUB_ENV
          echo "COLSAMPLE_BYTREE=$COLSAMPLE_BYTREE" >> $GITHUB_ENV
          echo "REG_ALPHA=$REG_ALPHA" >> $GITHUB_ENV
          echo "REG_LAMBDA=$REG_LAMBDA" >> $GITHUB_ENV
          echo "CHALLENGER_MODEL=$CHALLENGER_MODEL" >> $GITHUB_ENV
          echo
          echo "Validation thresholds:"
          echo "R2 minimum:         $R2_MIN"
          echo "MAPE maximum:       $MAPE_MAX"
          echo "MAE maximum:        $MAE_MAX"
          echo "RMSE ratio maximum: $RMSE_RATIO_MAX"
          echo "::endgroup::"

          if [[ "${STORAGE_TYPE:-}" == "datalake" ]]; then
              export WALMART_SALES_ASSET_URI=$DATALAKE_ASSET_URI
              TEMPLATE="azureml/job_datalake.template.yaml"
          elif [[ "${STORAGE_TYPE:-}" == "blobstore" ]]; then
              export WALMART_SALES_ASSET_URI=$BLOBSTORAGE_ASSET_URL
              TEMPLATE="azureml/job_blobstore.template.yaml"
          else
              echo "::error::STORAGE_TYPE must be either 'datalake' or 'blobstore'. Current value: '${STORAGE_TYPE:-<unset>}'"
              exit 1
          fi

          echo "::group::Render candidate job YAML"
          envsubst '${WALMART_SALES_ASSET_URI} ${EXPERIMENT_NAME} ${DESCRIPTION} ${COMPUTE_NAME} ${SCRIPT_NAME} ${TRAINING_ENVIRONMENT} ${ETA} ${MAX_DEPTH} ${N_ESTIMATORS} ${SUBSAMPLE} ${COLSAMPLE_BYTREE} ${REG_ALPHA} ${REG_LAMBDA} ${CHALLENGER_MODEL}' < "$TEMPLATE" > "$JOB_YAML$ITER"
          cat $JOB_YAML$ITER
          echo "::endgroup::"

      - name: Submit Azure ML job
        id: submit_job
        run: |
          set -euo pipefail
          JOB_STATUS_JSON=$(az ml job create --file "$JOB_YAML$ITER" \
                              --resource-group "$RG" \
                              --workspace-name "$WORKSPACE_NAME" \
                              -o json)
          JOB_NAME=$(echo "$JOB_STATUS_JSON" | jq -r '.name')
          JOB_STATUS=$(echo "$JOB_STATUS_JSON" | jq -r '.status')
          echo "Job $JOB_NAME was created with status $JOB_STATUS"
          echo "job_name=$JOB_NAME" >> "$GITHUB_OUTPUT"

      - name: Wait for training job
        timeout-minutes: 75
        uses: ./.github/actions/wait-for-aml-job
        with:
          job-name: ${{ steps.submit_job.outputs.job_name }}
          resource-group: ${{ env.RG }}
          workspace-name: ${{ env.WORKSPACE_NAME }}
          timeout-minutes: ${{ env.AML_JOB_TIMEOUT_MINUTES }}
          description: Training job

      - name: Get and validate MLFlow metrics
        env:
          JOB_NAME: ${{ steps.submit_job.outputs.job_name }}
          ITER: ${{ matrix.cfg.iteration }}
        run: |
          set -euo pipefail

          echo "::group::Validate candidate $ITER metrics"
          python src/walmart_ml/pipeline/validate_model_metrics.py \
            --iteration $ITER \
            --job_name $JOB_NAME \
            --rg "$RG" \
            --workspace_name "$WORKSPACE_NAME" \
            --r2_min "$R2_MIN" \
            --mape_max "$MAPE_MAX" \
            --mae_max "$MAE_MAX" \
            --rmse_ratio_max "$RMSE_RATIO_MAX"

          METRICS_FILE="job_eval_model_${JOB_NAME}.json"

          if [[ ! -s "$METRICS_FILE" ]]; then
            echo "::endgroup::"
            echo "::error title=Candidate metrics missing::Expected metrics file was not created: $METRICS_FILE"
            exit 1
          fi

          jq . "$METRICS_FILE"
          echo "::endgroup::"

          VALIDATION_STATUS="$(
            jq -r '.status | tostring' "$METRICS_FILE"
          )"

          R2="$(
            jq -r '.R2 // .r2 // .metrics.R2 // .metrics.r2 // "unknown"' \
              "$METRICS_FILE"
          )"

          MAPE="$(
            jq -r '.MAPE // .mape // .metrics.MAPE // .metrics.mape // "unknown"' \
              "$METRICS_FILE"
          )"

          MAE="$(
            jq -r '.MAE // .mae // .metrics.MAE // .metrics.mae // "unknown"' \
              "$METRICS_FILE"
          )"

          RMSE_RATIO="$(
            jq -r '
              .RMSE_RATIO //
              .rmse_ratio //
              .metrics.RMSE_RATIO //
              .metrics.rmse_ratio //
              "unknown"
            ' "$METRICS_FILE"
          )"

          if [[ "$VALIDATION_STATUS" == "false" ]]; then
            echo "::warning title=Candidate $ITER failed validation::R2=$R2, MAPE=$MAPE, MAE=$MAE, RMSE ratio=$RMSE_RATIO"
          fi

          {
            echo "## Candidate $ITER"
            echo
            echo "- Azure ML job: \`$JOB_NAME\`"
            echo "- Passed metric gates: \`$VALIDATION_STATUS\`"
            echo "- R2: \`$R2\`"
            echo "- MAPE: \`$MAPE\`"
            echo "- MAE: \`$MAE\`"
            echo "- RMSE ratio: \`$RMSE_RATIO\`"
            echo
            echo "## Generated reports"
            echo
            echo "| Report | Artifact | Retention |"
            echo "|---|---|---:|"
            echo "| Candidate $ITER metrics | \`training_job_${ITER}\` | 30 days |"
            echo
            echo "Report file: \`$METRICS_FILE\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload training job data
        uses: actions/upload-artifact@v4
        with:
          name: training_job_${{ matrix.cfg.iteration }}
          path: job_eval_model_${{ steps.submit_job.outputs.job_name }}.json
          if-no-files-found: warn
          retention-days: ${{ fromJSON(env.ARTIFACT_RETENTION_DAYS) }}

  train-challenger-model:
    name: Select the best model and train on all data
    needs: train-models
    if: ${{ success() && github.ref == 'refs/heads/main' && inputs.deploy_model_version == '' }}
    runs-on: ubuntu-latest
    env:
      FINAL_JOB_YAML: azureml/final-job.yaml
    outputs:
      challenger_model: ${{ steps.submit_job.outputs.job_name }}
    steps:
      - uses: actions/checkout@v6

      - name: Set up Azure CLI
        uses: ./.github/actions/azure-setup
        with:
          creds: ${{ secrets.TEST_AZURE_SECRET }}

      - name: Download candidate training artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: training_job_*
          path: training_jobs
          merge-multiple: true

      - name: Check for passing models
        run: |
          set -euo pipefail

          PASSING_MODELS=$(jq -s '[ .[] | select((.status|tostring)=="true") ]' training_jobs/*.json)
          if [ "$(echo "$PASSING_MODELS" | jq length)" -eq 0 ]; then
            echo "No models passed the validation criteria."
            echo "::error title=No passing models::All candidate models failed validation thresholds. Stopping pipeline."
            exit 1
          else
            echo "Found $(echo "$PASSING_MODELS" | jq length) passing models."
          fi

      - name: Compare results
        id: select_winner
        run: |
          set -euo pipefail

          # Rank passing candidates by WAPE, then RMSE, then absolute bias,
          # then MAPE (the same order as the champion-challenger test).
          # Missing values sort last.
          jq -s '
          map(
            .WAPE |= (try tonumber catch 1e18) |
            .RMSE |= (try tonumber catch 1e18) |
            .BIAS |= (try tonumber catch 1e18) |
            .MAPE |= (try tonumber catch 1e18)
          )
          | [ .[] | select((.status|tostring)=="true") ]
          | sort_by([ .WAPE, .RMSE, (.BIAS | if . < 0 then -. else . end), .MAPE ])
          | .[0]
          ' training_jobs/*.json > winner.json

          BEST_PERFORMER=$(jq -r '.job_name' winner.json)
          BEST_ITERATION=$(jq -r '.iteration' winner.json)
          ETA=$(jq -r '.hyperparameters.eta' winner.json)
          MAX_DEPTH=$(jq -r '.hyperparameters.max_depth' winner.json)
          N_ESTIMATORS=$(jq -r '.hyperparameters.n_estimators' winner.json)
          SUBSAMPLE=$(jq -r '.hyperparameters.subsample' winner.json)
          COLSAMPLE_BYTREE=$(jq -r '.hyperparameters.colsample_bytree' winner.json)
          REG_ALPHA=$(jq -r '.hyperparameters.reg_alpha' winner.json)
          REG_LAMBDA=$(jq -r '.hyperparameters.reg_lambda' winner.json)
          WAPE="$(jq -r '.metrics.WAPE' winner.json)"
          RMSE="$(jq -r '.metrics.RMSE' winner.json)"
          BIAS="$(jq -r '.metrics.BIAS' winner.json)"
          R2="$(jq -r '.metrics.R2' winner.json)"
          MAPE="$(jq -r '.metrics.MAPE' winner.json)"
          MAE="$(jq -r '.metrics.MAE' winner.json)"
          RMSE_RATIO="$(jq -r '.metrics.RMSE_RATIO' winner.json)"

          echo "best_performer=$BEST_PERFORMER" >> "$GITHUB_OUTPUT"
          echo "eta=$ETA" >> "$GITHUB_OUTPUT"
          echo "max_depth=$MAX_DEPTH" >> "$GITHUB_OUTPUT"
          echo "n_estimators=$N_ESTIMATORS" >> "$GITHUB_OUTPUT"
          echo "subsample=$SUBSAMPLE" >> "$GITHUB_OUTPUT"
          echo "colsample_bytree=$COLSAMPLE_BYTREE" >> "$GITHUB_OUTPUT"
          echo "reg_alpha=$REG_ALPHA" >> "$GITHUB_OUTPUT"
          echo "reg_lambda=$REG_LAMBDA" >> "$GITHUB_OUTPUT"

          echo "Best performer: $BEST_PERFORMER"
          echo "WAPE: $WAPE"
          echo "RMSE: $RMSE"
          echo "Bias: $BIAS"
          echo "R2: $R2"
          echo "MAPE: $MAPE"
          echo "MAE: $MAE"
          echo "RMSE ratio: $RMSE_RATIO"
          echo "eta: $ETA"
          echo "max_depth: $MAX_DEPTH"
          echo "n_estimators: $N_ESTIMATORS"
          echo "subsample: $SUBSAMPLE"
          echo "colsample_bytree: $COLSAMPLE_BYTREE"
          echo "reg_alpha: $REG_ALPHA"
          echo "reg_lambda: $REG_LAMBDA"

          echo "The best model is: "
          cat winner.json

          {
            echo "## Winning candidate"
            echo
            echo "- Azure ML job: \`$BEST_PERFORMER\`"
            echo
            echo "### Validation metrics"
            echo
            echo "Ranked by WAPE, then RMSE, then absolute bias, then MAPE."
            echo
            echo "| Metric | Value |"
            echo "|---|---:|"
            echo "| WAPE | \`$WAPE\` |"
            echo "| RMSE | \`$RMSE\` |"
            echo "| Bias | \`$BIAS\` |"
            echo "| R2 | \`$R2\` |"
            echo "| MAPE | \`$MAPE\` |"
            echo "| MAE | \`$MAE\` |"
            echo "| RMSE ratio | \`$RMSE_RATIO\` |"
            echo
            echo "### Hyperparameters"
            echo
            echo "| Hyperparameter | Value |"
            echo "|---|---:|"
            echo "| eta | \`$ETA\` |"
            echo "| max depth | \`$MAX_DEPTH\` |"
            echo "| estimators | \`$N_ESTIMATORS\` |"
            echo "| subsample | \`$SUBSAMPLE\` |"
            echo "| column sample by tree | \`$COLSAMPLE_BYTREE\` |"
            echo "| regularisation alpha | \`$REG_ALPHA\` |"
            echo "| regularisation lambda | \`$REG_LAMBDA\` |"
            echo
            echo "## Generated reports"
            echo
            echo "| Report | Artifact |"
            echo "|---|---|"
            echo "| Winning candidate data | \`winning_candidate\` |"
            echo
            echo "Report file: \`winner.json\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload training job data
        uses: actions/upload-artifact@v4
        with:
          name: winning_candidate
          path: winner.json

      - name: Create job template
        env:
          ETA: ${{ steps.select_winner.outputs.eta }}
          MAX_DEPTH: ${{ steps.select_winner.outputs.max_depth }}
          N_ESTIMATORS: ${{ steps.select_winner.outputs.n_estimators }}
          SUBSAMPLE: ${{ steps.select_winner.outputs.subsample }}
          COLSAMPLE_BYTREE: ${{ steps.select_winner.outputs.colsample_bytree }}
          REG_ALPHA: ${{ steps.select_winner.outputs.reg_alpha }}
          REG_LAMBDA: ${{ steps.select_winner.outputs.reg_lambda }}
          SCRIPT_NAME: "train"
          COMPUTE_NAME: "${{ vars.TEST_PREFIX }}-compute"
          DESCRIPTION: "Final Walmart model trained using best validated hyperparameters"
          EXPERIMENT_NAME: "${{ vars.TEST_PREFIX }}_challenger_experiment"
          CHALLENGER_MODEL: "--challenger_model"
        run: |
          set -euo pipefail
          if [[ "${STORAGE_TYPE:-}" == "datalake" ]]; then
              export WALMART_SALES_ASSET_URI=$DATALAKE_ASSET_URI
              TEMPLATE="azureml/job_datalake.template.yaml"
          elif [[ "${STORAGE_TYPE:-}" == "blobstore" ]]; then
              export WALMART_SALES_ASSET_URI=$BLOBSTORAGE_ASSET_URL
              TEMPLATE="azureml/job_blobstore.template.yaml"
          else
              echo "::error::STORAGE_TYPE must be either 'datalake' or 'blobstore'. Current value: '${STORAGE_TYPE:-<unset>}'"
              exit 1
          fi

          envsubst '${WALMART_SALES_ASSET_URI} ${EXPERIMENT_NAME} ${DESCRIPTION} ${COMPUTE_NAME} ${SCRIPT_NAME} ${TRAINING_ENVIRONMENT} ${ETA} ${MAX_DEPTH} ${N_ESTIMATORS} ${SUBSAMPLE} ${COLSAMPLE_BYTREE} ${REG_ALPHA} ${REG_LAMBDA} ${CHALLENGER_MODEL}' < "$TEMPLATE" > "$FINAL_JOB_YAML"
          cat $FINAL_JOB_YAML

      - name: Submit Azure ML job to rebuild job with more data
        id: submit_job
        run: |
          set -euo pipefail
          JOB_STATUS_JSON=$(az ml job create --file "$FINAL_JOB_YAML" \
                              --resource-group "$RG" \
                              --workspace-name "$WORKSPACE_NAME" \
                              -o json)
          JOB_NAME=$(echo "$JOB_STATUS_JSON" | jq -r '.name')
          JOB_STATUS=$(echo "$JOB_STATUS_JSON" | jq -r '.status')
          echo "Job $JOB_NAME was created with status $JOB_STATUS"
          echo "job_name=$JOB_NAME" >> "$GITHUB_OUTPUT"

      - name: Wait for challenger training job
        timeout-minutes: 75
        uses: ./.github/actions/wait-for-aml-job
        with:
          job-name: ${{ steps.submit_job.outputs.job_name }}
          resource-group: ${{ env.RG }}
          workspace-name: ${{ env.WORKSPACE_NAME }}
          timeout-minutes: ${{ env.AML_JOB_TIMEOUT_MINUTES }}
          description: Challenger training job

  champion-challenger-testing:
    name: Champion/Challenger testing for real-time endpoint
    if: ${{ success() && github.ref == 'refs/heads/main' && inputs.deploy_model_version == '' }}
    needs: [train-challenger-model, get-endpoint-names, retrieve-last-date]
    runs-on: ubuntu-latest
    env:
      JOB_NAME: ${{ needs.train-challenger-model.outputs.challenger_model }}
      RT_ENDPOINT_NAME: ${{ needs.get-endpoint-names.outputs.rt_endpoint_name }}
      LATEST_PROCESSED_DATE: ${{ needs.retrieve-last-date.outputs.latestdate }}
      CHALLENGER_PREDICTIONS_FILE: challenger_predictions/artifacts/outputs/challenger_forecast_by_store.csv
      CHAMPION_PREDICTIONS_FILE: ${{ github.workspace }}/champion-rt-response.json
      ACTUAL_VALUES_FILE: ${{ github.workspace }}/walmart_sales_actual.csv
    outputs:
      winner: ${{ steps.set_winner.outputs.winner }}
    steps:
      - uses: actions/checkout@v6

      - name: Set up Azure CLI
        uses: ./.github/actions/azure-setup
        with:
          creds: ${{ secrets.TEST_AZURE_SECRET }}

      - name: Set up Python and install walmart_ml
        uses: ./.github/actions/python-setup
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          extras: "all"

      - name: Check if champion exists
        id: check_champion
        run: |
          set -euo pipefail

          echo "::group::Query endpoint traffic"
          RT_TRAFFIC="$(
            az ml online-endpoint show \
              --name "$RT_ENDPOINT_NAME" \
              --resource-group "$RG" \
              --workspace-name "$WORKSPACE_NAME" \
              --query "traffic" \
              --output json
          )"

          echo "Current traffic allocation:"
          jq . <<< "$RT_TRAFFIC"
          echo "::endgroup::"

          CHAMPION_RT_DEPLOYMENT_NAME="$(
            jq --raw-output '
              if type == "object" and length > 0 then
                to_entries
                | max_by(.value)
                | .key
              else
                empty
              end
            ' <<< "$RT_TRAFFIC"
          )"

          if [[ -n "$CHAMPION_RT_DEPLOYMENT_NAME" &&
                "$CHAMPION_RT_DEPLOYMENT_NAME" != "null" ]]; then
            echo "champion_rt_deployment_exists=true" >> "$GITHUB_OUTPUT"
            echo "champion_rt_deployment_name=$CHAMPION_RT_DEPLOYMENT_NAME" \
              >> "$GITHUB_OUTPUT"

            CHAMPION_TRAFFIC="$(
              jq --raw-output \
                --arg deployment "$CHAMPION_RT_DEPLOYMENT_NAME" \
                '.[$deployment]' \
                <<< "$RT_TRAFFIC"
            )"

            echo "Champion real-time deployment exists: $CHAMPION_RT_DEPLOYMENT_NAME"
            echo "Traffic allocation: ${CHAMPION_TRAFFIC}%"
          else
            echo "champion_rt_deployment_exists=false" >> "$GITHUB_OUTPUT"
            echo "champion_rt_deployment_name=" >> "$GITHUB_OUTPUT"
            echo "No deployment receives traffic for endpoint '$RT_ENDPOINT_NAME'."
          fi

      - name: Get Champion predictions
        if: ${{ steps.check_champion.outputs.champion_rt_deployment_exists == 'true' }}
        run: |
         set -euo pipefail
         CHAMPION_RT_DEPLOYMENT_NAME="${{ steps.check_champion.outputs.champion_rt_deployment_name }}"

          REQUEST_FILE="${RUNNER_TEMP}/rt-request.json"
          RAW_RESPONSE_FILE="${RUNNER_TEMP}/rt-raw-response.json"

          echo "::group::Prepare champion request"
          echo "Endpoint:   $RT_ENDPOINT_NAME"
          echo "Deployment: $CHAMPION_RT_DEPLOYMENT_NAME"
          PREVIOUS_PROCESSED_DATE="$(
            python3 -c 'from datetime import datetime, timedelta; import sys; value = datetime.strptime(sys.argv[1], "%d-%m-%Y") - timedelta(days=7); print(value.strftime("%d-%m-%Y"))' "$LATEST_PROCESSED_DATE"
          )"

          echo "Previous processed date: $PREVIOUS_PROCESSED_DATE"

          jq \
            --arg date "$PREVIOUS_PROCESSED_DATE" \
            --null-input \
            '{
                input_data: [
                    range(1; 46) as $store
                    | {
                        Store: $store,
                        Date: $date
                    }
                ]
            }' > "$REQUEST_FILE"

          REQUEST_COUNT="$(jq '.input_data | length' "$REQUEST_FILE")"

          echo "Request file: $REQUEST_FILE"
          echo "Store count:  $REQUEST_COUNT"

          if [[ "$REQUEST_COUNT" -ne 45 ]]; then
            echo "::endgroup::"
            echo "::error title=Invalid champion request::Expected 45 stores but generated $REQUEST_COUNT"
            exit 1
          fi

          jq . "$REQUEST_FILE"
          echo "::endgroup::"

          echo "::group::Invoke champion deployment"
          if ! az ml online-endpoint invoke \
            --name "$RT_ENDPOINT_NAME" \
            --deployment-name "$CHAMPION_RT_DEPLOYMENT_NAME" \
            --resource-group "$RG" \
            --workspace-name "$WORKSPACE_NAME" \
            --request-file "$REQUEST_FILE" \
            --output json > "$RAW_RESPONSE_FILE"; then

            echo "::error title=Endpoint invocation failed::Azure CLI could not invoke the deployment."

            az ml online-deployment get-logs \
              --name "$CHAMPION_RT_DEPLOYMENT_NAME" \
              --endpoint-name "$RT_ENDPOINT_NAME" \
              --resource-group "$RG" \
              --workspace-name "$WORKSPACE_NAME" \
              --lines 200 || true

            exit 1
          fi

          if [[ ! -s "$RAW_RESPONSE_FILE" ]]; then
            echo "::error title=Empty endpoint response::The endpoint returned no content."
            exit 1
          fi
          echo "::endgroup::"

          echo "::group::Process champion response"

          jq -r 'fromjson' "$RAW_RESPONSE_FILE" > "$CHAMPION_PREDICTIONS_FILE"

          if [[ ! -s "$CHAMPION_PREDICTIONS_FILE" ]]; then
            echo "::error title=Missing predictions::Champion predictions were not created."
            exit 1
          fi

          CHAMPION_PREDICTION_COUNT="$(
            jq '
              if type == "array" then
                length
              elif .predictions? | type == "array" then
                .predictions | length
              else
                0
              end
            ' "$CHAMPION_PREDICTIONS_FILE"
          )"
          echo "Predictions file:  $CHAMPION_PREDICTIONS_FILE"
          echo "Prediction count:  $CHAMPION_PREDICTION_COUNT"
          jq . "$CHAMPION_PREDICTIONS_FILE"
          echo "::endgroup::"

      - name: Download challenger predictions
        run: |
          set -euo pipefail
          echo "::group::Download challenger job outputs"
          echo "Azure ML job: $JOB_NAME"
          az ml job download \
            --name "$JOB_NAME" \
            --resource-group "$RG" \
            --workspace-name "$WORKSPACE_NAME" \
            --download-path "challenger_predictions"

          ls challenger_predictions/artifacts/outputs

          if [[ ! -s "$CHALLENGER_PREDICTIONS_FILE" ]]; then
            echo "::error title=Missing file::$CHALLENGER_PREDICTIONS_FILE was not found"
            exit 1
          fi

          echo "Challenger predictions found: $CHALLENGER_PREDICTIONS_FILE"
          echo "::endgroup::"
          echo "::group::Inspect challenger outputs"
          ROW_COUNT="$(
            python3 -c 'import pandas as pd, sys; print(len(pd.read_csv(sys.argv[1])))' "$CHALLENGER_PREDICTIONS_FILE"
          )"
          echo "Row count: $ROW_COUNT"
          head -n 6 "$CHALLENGER_PREDICTIONS_FILE"
          echo "::endgroup::"

      - name: Set winner
        id: set_winner
        run: |
          set -euo pipefail
          CHAMPTION_RT_DEPLOYMENT_EXISTS=${{ steps.check_champion.outputs.champion_rt_deployment_exists }}
          if [[ "$CHAMPTION_RT_DEPLOYMENT_EXISTS" == "false" ]]; then
            echo "winner=challenger" >> "$GITHUB_OUTPUT"
            {
              echo "## Champion/challenger result"
              echo
              echo "| Property | Value |"
              echo "|---|---|"
              echo "| Winner | \`challenger\` |"
              echo "| Reason | No existing champion deployment |"
              echo "| Challenger job | \`$JOB_NAME\` |"
              echo "| Endpoint | \`$RT_ENDPOINT_NAME\` |"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            python src/walmart_ml/pipeline/select_winner.py \
              --challenger-predictions "$CHALLENGER_PREDICTIONS_FILE" \
              --champion-predictions "$CHAMPION_PREDICTIONS_FILE" \
              --github-output "$GITHUB_OUTPUT"

            if [[ ! -s "challenger_champion_summary.txt" ]]; then
              echo "::endgroup::"
              echo "::error title=Missing comparison summary::challenger_champion_summary.txt was not created"
              exit 1
            fi
            cat "challenger_champion_summary.txt" >> "$GITHUB_STEP_SUMMARY"

          fi

          # TO BE REMOVED FOR TESTING ONLY
          # echo "winner=challenger" >> "$GITHUB_OUTPUT"

      - name: Upload champion-challenger comparison files
        if: ${{ steps.check_champion.outputs.champion_rt_deployment_exists == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: champion-challenger-comparison
          path: |
            challenger_champion_summary.txt
            challenger_champion_comparison.csv
          if-no-files-found: warn
          retention-days: ${{ fromJSON(env.ARTIFACT_RETENTION_DAYS) }}

  register-challenger-model:
    name: Register model in Azure ML
    needs: [train-challenger-model, champion-challenger-testing]
    if: ${{ success() && github.ref == 'refs/heads/main' && inputs.deploy_model_version == '' }}
    runs-on: ubuntu-latest
    outputs:
      model_version: ${{ steps.register_model.outputs.model_version }}
    env:
      MLFLOW_ARTIFACT_PATH: model
      MODEL_DESCRIPTION: "XGBoost sales forecast model (auto-versioned)"
      MODEL_YAML: azureml/model.yaml
      WINNER: ${{ needs.champion-challenger-testing.outputs.winner }}
      JOB_NAME: ${{ needs.train-challenger-model.outputs.challenger_model }}
    steps:
      - uses: actions/checkout@v6

      - name: Set up Azure CLI
        uses: ./.github/actions/azure-setup
        with:
          creds: ${{ secrets.TEST_AZURE_SECRET }}

      - name: Render Azure ML job YAML from template
        run: |
          set -euo pipefail

          TEMPLATE=azureml/model.template.yaml
          envsubst '${JOB_NAME} ${MODEL_NAME} ${MODEL_DESCRIPTION}' < "$TEMPLATE" > "$MODEL_YAML"
          echo "Creatng yaml for MLflow model ${MODEL_NAME} from $JOB_NAME"
          cat "$MODEL_YAML"

      - name: Register model from latest job
        id: register_model
        run: |
          set -euo pipefail

          echo "Registering model"

          if [[ "$WINNER" == "challenger" ]]; then
            DESCRIPTION="Challenger model registered after winning the champion-challenger test"
            PROMOTION_STATUS="accepted"
          else
            DESCRIPTION="Challenger model registered after losing the champion-challenger test"
            PROMOTION_STATUS="rejected"
          fi

          MODEL_JSON=$(az ml model create --file "$MODEL_YAML" --description "$DESCRIPTION" --set tags.promotion_status=$PROMOTION_STATUS --resource-group "$RG" --workspace-name "$WORKSPACE_NAME" -o json)
          MODEL_VERSION=$(echo "$MODEL_JSON" | jq -r '.version')
          echo "model_version=$MODEL_VERSION" >> "$GITHUB_OUTPUT"
          echo "Challenger model $MODEL_NAME was registered with version $MODEL_VERSION"
          {
            echo "## Challenger model registration"
            echo
            echo "| Property | Value |"
            echo "|---|---|"
            echo "| Model | \`$MODEL_NAME:$MODEL_VERSION\` |"
            echo "| Source job | \`$JOB_NAME\` |"
            echo "| Champion/challenger winner | \`$WINNER\` |"
            echo "| Promotion status | \`$PROMOTION_STATUS\` |"
            echo "| Resource group | \`$RG\` |"
            echo "| Workspace | \`$WORKSPACE_NAME\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  create-rt-endpoint-deployment:
    name: Create real-time endpoint deployment for the new model
    if: ${{ !cancelled() && !failure() && github.ref == 'refs/heads/main' && (inputs.deploy_model_version != '' || needs.champion-challenger-testing.outputs.winner == 'challenger') }}
    needs: [register-challenger-model, champion-challenger-testing, get-endpoint-names, retrieve-last-date]
    outputs:
      rt_deployment_name: ${{ steps.create-rt-endpoint-deployment.outputs.rt_deployment_name }}
    env:
      RT_DEPLOYMENT_YAML: azureml/rt-deployment.yaml
      MODEL_VERSION: ${{ inputs.deploy_model_version || needs.register-challenger-model.outputs.model_version }}
      RT_ENDPOINT_NAME: ${{ needs.get-endpoint-names.outputs.rt_endpoint_name }}
      LATEST_PROCESSED_DATE: ${{ needs.retrieve-last-date.outputs.latestdate }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Azure CLI
        uses: ./.github/actions/azure-setup
        with:
          creds: ${{ secrets.TEST_AZURE_SECRET }}

      - name: Create deployment
        id: create-rt-endpoint-deployment
        run: .github/scripts/create-rt-deployment.sh

      - name: Write real-time deployment summary
        run: |
          {
            echo "## Real-time deployment"
            echo
            echo "| Property | Value |"
            echo "|---|---|"
            echo "| Endpoint | \`$RT_ENDPOINT_NAME\` |"
            echo "| Deployment | \`$RT_DEPLOYMENT_NAME\` |"
            echo "| Provisioning state | \`Succeeded\` |"
            echo "| Model | \`${MODEL_NAME}:${MODEL_VERSION}\` |"
            echo "| Feature data | \`${FEATURE_DATA_ASSET_NAME}:${FEATURE_DATA_ASSET_VERSION}\` |"
            echo "| Instance type | \`Standard_F4s_v2\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Test real-time endpoint
        uses: ./.github/actions/test-rt-endpoint
        with:
          endpoint-name: ${{ env.RT_ENDPOINT_NAME }}
          deployment-name: ${{ env.RT_DEPLOYMENT_NAME }}
          request-date: ${{ env.LATEST_PROCESSED_DATE }}
          resource-group: ${{ env.RG }}
          workspace-name: ${{ env.WORKSPACE_NAME }}

  locust-load-test:
    name: Load test real-time endpoint with Locust
    needs: [create-rt-endpoint-deployment, get-endpoint-names]
    if: ${{ !cancelled() && !failure() && github.ref == 'refs/heads/main' && needs.create-rt-endpoint-deployment.result == 'success' }}
    runs-on: ubuntu-latest
    env:
      RT_ENDPOINT_NAME: ${{ needs.get-endpoint-names.outputs.rt_endpoint_name }}
      RT_DEPLOYMENT_NAME: ${{ needs.create-rt-endpoint-deployment.outputs.rt_deployment_name }}
      LOCUST_USERS: 5          # concurrent simulated users
      LOCUST_SPAWN_RATE: 1     # users per second
      LOCUST_RUN_TIME: 60s       # total duration
      LOCUST_P95_MAX_MS: 1000   # 1.5s max p95 latency
      LOCUST_MAX_FAIL_RATIO: 0.05  # 5% max failure ratio
      LOCUST_STATS_FILE: locust/locust-summary.json
    steps:
      - uses: actions/checkout@v6

      - name: Set up Azure CLI
        uses: ./.github/actions/azure-setup
        with:
          creds: ${{ secrets.TEST_AZURE_SECRET }}

      - name: Get scoring URI and token details
        id: get_endpoint_creds
        run: |
         set -euo pipefail
         SCORE_URI=$(az ml online-endpoint show \
            --name "$RT_ENDPOINT_NAME" \
            --resource-group "$RG" \
            --workspace-name "$WORKSPACE_NAME" \
            --query "scoring_uri" -o tsv)

          TOKEN=$(az ml online-endpoint get-credentials \
            --name "$RT_ENDPOINT_NAME" \
            --resource-group "$RG" \
            --workspace-name "$WORKSPACE_NAME" \
            --query primaryKey -o tsv)

          echo "::add-mask::$TOKEN"

          if [[ -z "$SCORE_URI" ]]; then
            echo "::error title=Missing scoring URI::Azure ML did not return a scoring URI"
            exit 1
          fi

          if [[ -z "$TOKEN" ]]; then
            echo "::error title=Missing endpoint credential::Azure ML did not return an endpoint key"
            exit 1
          fi

          echo "SCORE_URI=$SCORE_URI" >> $GITHUB_ENV
          echo "AZUREML_TOKEN=$TOKEN" >> $GITHUB_ENV

      - name: Set up Python and install walmart_ml
        uses: ./.github/actions/python-setup
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          extras: "loadtest"

      - name: Run Locust load test against new deployment
        env:
          AZUREML_DEPLOYMENT: ${{ env.RT_DEPLOYMENT_NAME }}
          LOCUST_STATS_FILE: locust/locust-summary.json
        run: .github/scripts/run-locust-load-test.sh

      - name: List generated Locust reports
        if: ${{ always() }}
        shell: bash
        run: |
         set -euo pipefail
         echo "::group::Generated Locust reports"

          if [[ -d locust ]]; then
            find locust \
              -maxdepth 1 \
              -type f \
              -printf '%f (%s bytes)\n' |
              sort
          else
            echo "::warning title=Missing reports directory::locust was not created"
          fi

          echo "::endgroup::"

      - name: Upload Locust reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: locust-load-test-${{ github.run_id }}
          path: locust/
          if-no-files-found: warn
          retention-days: ${{ fromJSON(env.ARTIFACT_RETENTION_DAYS) }}

  update-traffic:
    name: Update traffic to new endpoint
    needs: [locust-load-test, create-rt-endpoint-deployment, get-endpoint-names]
    if: ${{ !cancelled() && !failure() && github.ref == 'refs/heads/main' && needs.locust-load-test.result == 'success' }}
    runs-on: ubuntu-latest
    env:
      RT_ENDPOINT_NAME: ${{ needs.get-endpoint-names.outputs.rt_endpoint_name }}
      RT_DEPLOYMENT_NAME: ${{ needs.create-rt-endpoint-deployment.outputs.rt_deployment_name }}
    steps:
      - uses: actions/checkout@v6

      - name: Set up Azure CLI
        uses: ./.github/actions/azure-setup
        with:
          creds: ${{ secrets.TEST_AZURE_SECRET }}

      - name: Send all traffic to the new deployment
        uses: ./.github/actions/update-rt-traffic
        with:
          endpoint-name: ${{ env.RT_ENDPOINT_NAME }}
          deployment-name: ${{ env.RT_DEPLOYMENT_NAME }}
          resource-group: ${{ env.RG }}
          workspace-name: ${{ env.WORKSPACE_NAME }}

  create-batch-endpoint-deployment:
    name: Create batch endpoint deployment for the new model
    needs: [update-traffic, get-endpoint-names, retrieve-last-date, register-challenger-model]
    if: ${{ !cancelled() && !failure() && github.ref == 'refs/heads/main' && needs.update-traffic.result == 'success' }}
    env:
      BATCH_DEPLOYMENT_TEMPLATE: azureml/batch-deployment-template.yaml
      BATCH_DEPLOYMENT_YAML: azureml/batch-endpoint-deployment.yaml
      BATCH_ENDPOINT_NAME: ${{ needs.get-endpoint-names.outputs.batch_endpoint_name }}
      MODEL_VERSION: ${{ inputs.deploy_model_version || needs.register-challenger-model.outputs.model_version }}
    outputs:
      batch_deployment_name: ${{ steps.create_batch_deployment.outputs.batch_deployment_name }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Azure CLI
        uses: ./.github/actions/azure-setup
        with:
          creds: ${{ secrets.TEST_AZURE_SECRET }}

      - name: Set up Python and install walmart_ml
        uses: ./.github/actions/python-setup
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          extras: "all"

      - name: Create deployment
        id: create_batch_deployment
        run: |
          set -euo pipefail
          TIMESTAMP="$(date -u +'%Y%m%d-%H%M%S')"
          BATCH_DEPLOYMENT_NAME="batch-deployment-$TIMESTAMP"
          BATCH_DEPLOYMENT_DESC="XGBoost Walmart sales batch deployment"
          COMPUTE_NAME="${{ vars.TEST_PREFIX }}-compute"
          SCORE_SCRIPT="batch.py"

          echo "BATCH_DEPLOYMENT_NAME=$BATCH_DEPLOYMENT_NAME" >> $GITHUB_ENV
          echo "batch_deployment_name=$BATCH_DEPLOYMENT_NAME" >> "$GITHUB_OUTPUT"

          echo "::group::Resolve and verify Azure resources"
          SUBSCRIPTION_ID="$(
              az account show \
                  --query id \
                  --output tsv
          )"

          FEATURE_DATA_ASSET_VERSION="$(
              az ml data show \
                --name "$FEATURE_DATA_ASSET_NAME" \
                --label latest \
                --resource-group "$RG" \
                --workspace-name "$WORKSPACE_NAME" \
                --query version \
                --output tsv
          )"
          if [[ -z "$SUBSCRIPTION_ID" ]]; then
            echo "::endgroup::"
            echo "::error title=Missing subscription ID::Could not determine the Azure subscription ID"
            exit 1
          fi

          if [[ -z "$FEATURE_DATA_ASSET_VERSION" ]]; then
            echo "::endgroup::"
            echo "::error title=Missing feature data version::Could not determine the latest feature-data version"
            exit 1
          fi
          echo "FEATURE_DATA_ASSET_VERSION=$FEATURE_DATA_ASSET_VERSION" >> "$GITHUB_ENV"

          echo "Subscription ID:      $SUBSCRIPTION_ID"
          echo "Feature data version: $FEATURE_DATA_ASSET_VERSION"
          echo "::endgroup::"

          echo "::group::Render batch deployment YAML"
          export BATCH_DEPLOYMENT_NAME BATCH_DEPLOYMENT_DESC COMPUTE_NAME SCORE_SCRIPT SUBSCRIPTION_ID FEATURE_DATA_ASSET_VERSION
          envsubst '${BATCH_DEPLOYMENT_NAME} ${BATCH_DEPLOYMENT_DESC} ${BATCH_ENDPOINT_NAME} ${MODEL_NAME} ${MODEL_VERSION} ${COMPUTE_NAME} ${ENDPOINT_ENVIRONMENT} ${SUBSCRIPTION_ID} ${RG} ${WORKSPACE_NAME} ${FEATURE_DATA_ASSET_NAME} ${FEATURE_DATA_ASSET_VERSION} ${SCORE_SCRIPT}' < azureml/batch-deployment-template.yaml > $BATCH_DEPLOYMENT_YAML

          if [[ ! -f "$BATCH_DEPLOYMENT_YAML" ]]; then
            echo "::error title=Missing file::Batch endpoint deployment YAML not found at: $BATCH_DEPLOYMENT_YAML"
            exit 1
          fi

          cat $BATCH_DEPLOYMENT_YAML

          echo "::endgroup::"

          echo "::group::Create Azure ML batch deployment"
          # --set-default # causes breakage
          BATCH_DEPLOYMENT_JSON=$(az ml batch-deployment create --resource-group "$RG" --workspace-name "$WORKSPACE_NAME" --file "$BATCH_DEPLOYMENT_YAML")

          BATCH_DEPLOYMENT_STATE=$(echo "$BATCH_DEPLOYMENT_JSON" | jq -r '.provisioning_state')

          if [[ "$BATCH_DEPLOYMENT_STATE" == "Succeeded" ]]; then
              echo "Batch deployment '$BATCH_DEPLOYMENT_NAME' created successfully in resource group '$RG'"
          else
              echo "Failed to create batch deployment '$BATCH_DEPLOYMENT_NAME' (provisioningState: $BATCH_DEPLOYMENT_STATE)"
              exit 1
          fi
          echo "::endgroup::"

      - name: Find latest test data version
        id: test_data
        run: |
          set -euo pipefail
          TEST_DATA_VERSION="$(
            az ml data list \
              --name test_data \
              --resource-group "$RG" \
              --workspace-name "$WORKSPACE_NAME" \
              --query "[].version" \
              --output tsv |
            sort --version-sort |
            tail --lines=1
          )"

          if [[ -z "$TEST_DATA_VERSION" ]]; then
            echo "::error title=Missing data asset::No versions of azureml:test_data were found."
            exit 1
          fi

          echo "Latest test data version: $TEST_DATA_VERSION"
          echo "version=$TEST_DATA_VERSION" >> "$GITHUB_OUTPUT"

      - name: Run batch endpoint job
        id: batch_job
        timeout-minutes: 75
        uses: ./.github/actions/run-batch-job
        with:
          endpoint-name: ${{ env.BATCH_ENDPOINT_NAME }}
          deployment-name: ${{ env.BATCH_DEPLOYMENT_NAME }}
          input: azureml:test_data:${{ steps.test_data.outputs.version }}
          resource-group: ${{ env.RG }}
          workspace-name: ${{ env.WORKSPACE_NAME }}
          timeout-minutes: ${{ env.AML_JOB_TIMEOUT_MINUTES }}

      - name: Validate batch job output
        id: validate_batch_output
        uses: ./.github/actions/validate-batch-output
        with:
          job-name: ${{ steps.batch_job.outputs.job-name }}
          resource-group: ${{ env.RG }}
          workspace-name: ${{ env.WORKSPACE_NAME }}

      - name: Set batch deployment as default
        id: set_default
        uses: ./.github/actions/set-default-batch-deployment
        with:
          endpoint-name: ${{ env.BATCH_ENDPOINT_NAME }}
          deployment-name: ${{ env.BATCH_DEPLOYMENT_NAME }}
          resource-group: ${{ env.RG }}
          workspace-name: ${{ env.WORKSPACE_NAME }}

      - name: Write batch deployment summary
        env:
          BATCH_JOB_NAME: ${{ steps.batch_job.outputs.job-name }}
          TEST_DATA_VERSION: ${{ steps.test_data.outputs.version }}
          PREVIOUS_DEFAULT: ${{ steps.set_default.outputs.previous-default }}
          CURRENT_DEFAULT: ${{ steps.set_default.outputs.current-default }}
        run: |
          {
            echo "## Batch endpoint deployment"
            echo
            echo "| Property | Value |"
            echo "|---|---|"
            echo "| Endpoint | \`$BATCH_ENDPOINT_NAME\` |"
            echo "| Deployment | \`$BATCH_DEPLOYMENT_NAME\` |"
            echo "| Deployment state | \`Succeeded\` |"
            echo "| Model | \`${MODEL_NAME}:${MODEL_VERSION}\` |"
            echo "| Feature data | \`${FEATURE_DATA_ASSET_NAME}:${FEATURE_DATA_ASSET_VERSION}\` |"
            echo "| Test-data version | \`$TEST_DATA_VERSION\` |"
            echo "| Batch job | \`$BATCH_JOB_NAME\` |"
            echo "| Prediction rows | \`${{ steps.validate_batch_output.outputs.prediction_count }}\` |"
            echo "| Previous default | \`${PREVIOUS_DEFAULT:-none}\` |"
            echo "| Current default | \`$CURRENT_DEFAULT\` |"
            echo
            echo "## Generated reports"
            echo
            echo "| Report | Artifact |"
            echo "|---|---|"
            echo "| Batch predictions | \`batch-predictions-${{ github.run_id }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload batch predictions
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: batch-predictions-${{ github.run_id }}
          path: batch-results/
          if-no-files-found: warn
          retention-days: ${{ fromJSON(env.ARTIFACT_RETENTION_DAYS) }}

  delete-orphan-deployments:
    name: Delete old deployments
    runs-on: ubuntu-latest
    if: ${{ !cancelled() && !failure() && github.ref == 'refs/heads/main' && needs.create-batch-endpoint-deployment.result == 'success' }}
    needs: [get-endpoint-names, create-batch-endpoint-deployment, update-traffic]
    env:
      BATCH_ENDPOINT_NAME: ${{ needs.get-endpoint-names.outputs.batch_endpoint_name }}
      RT_ENDPOINT_NAME: ${{ needs.get-endpoint-names.outputs.rt_endpoint_name }}
    steps:
      - name: Check out workflow actions and scripts
        uses: actions/checkout@v6
        with:
          sparse-checkout: .github

      - name: Set up Azure CLI
        uses: ./.github/actions/azure-setup
        with:
          creds: ${{ secrets.TEST_AZURE_SECRET }}

      - name: Delete real-time deployments with no traffic
        uses: ./.github/actions/delete-orphan-rt-deployments
        with:
          endpoint-name: ${{ env.RT_ENDPOINT_NAME }}
          resource-group: ${{ env.RG }}
          workspace-name: ${{ env.WORKSPACE_NAME }}

      - name: Delete non-default batch deployments
        uses: ./.github/actions/delete-non-default-batch-deployments
        with:
          endpoint-name: ${{ env.BATCH_ENDPOINT_NAME }}
          resource-group: ${{ env.RG }}
          workspace-name: ${{ env.WORKSPACE_NAME }}
