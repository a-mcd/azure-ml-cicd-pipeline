name: Python setup
description: Set up Python with pip caching and install the walmart_ml package.

inputs:
  python-version:
    description: Python version to install.
    required: true
  extras:
    description: >-
      Comma-separated pyproject extras to install, for example "dev" or
      "train,spark". Leave empty to install only the base package.
    required: false
    default: ""
  verify-spark:
    description: Set to "true" to check the Java and distutils set-up PySpark needs.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: ${{ inputs.python-version }}
        cache: pip
        cache-dependency-path: pyproject.toml

    - name: Install walmart_ml
      shell: bash
      env:
        EXTRAS: ${{ inputs.extras }}
        VERIFY_SPARK: ${{ inputs.verify-spark }}
      run: ${{ github.action_path }}/install.sh
