name: Run batch endpoint job
description: Invoke a batch deployment on a data asset and wait for the job to finish.

inputs:
  endpoint-name:
    description: Batch endpoint name.
    required: true
  deployment-name:
    description: Batch deployment to run.
    required: true
  input:
    description: Input data asset, for example azureml:test_data:3.
    required: true
  resource-group:
    description: Resource group of the workspace.
    required: true
  workspace-name:
    description: Azure ML workspace holding the endpoint.
    required: true
  timeout-minutes:
    description: Minutes to wait before cancelling the job.
    required: false
    default: "60"

outputs:
  job-name:
    description: Name of the batch scoring job.
    value: ${{ steps.invoke.outputs.job-name }}

runs:
  using: composite
  steps:
    - name: Invoke batch deployment
      id: invoke
      shell: bash
      env:
        BATCH_ENDPOINT_NAME: ${{ inputs.endpoint-name }}
        BATCH_DEPLOYMENT_NAME: ${{ inputs.deployment-name }}
        BATCH_INPUT: ${{ inputs.input }}
        RG: ${{ inputs.resource-group }}
        WORKSPACE_NAME: ${{ inputs.workspace-name }}
      run: |
        set -euo pipefail
        echo "Using batch input: $BATCH_INPUT"
        BATCH_JOB_NAME="$(
          az ml batch-endpoint invoke \
            --name "$BATCH_ENDPOINT_NAME" \
            --deployment-name "$BATCH_DEPLOYMENT_NAME" \
            --input "$BATCH_INPUT" \
            --input-type uri_file \
            --resource-group "$RG" \
            --workspace-name "$WORKSPACE_NAME" \
            --query name \
            --output tsv
        )"
        echo "Batch job: $BATCH_JOB_NAME"
        echo "job-name=$BATCH_JOB_NAME" >> "$GITHUB_OUTPUT"

    - name: Wait for batch job
      uses: ./.github/actions/wait-for-aml-job
      with:
        job-name: ${{ steps.invoke.outputs.job-name }}
        resource-group: ${{ inputs.resource-group }}
        workspace-name: ${{ inputs.workspace-name }}
        timeout-minutes: ${{ inputs.timeout-minutes }}
        description: Batch job
