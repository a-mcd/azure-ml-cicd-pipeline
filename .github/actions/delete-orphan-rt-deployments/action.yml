name: Delete real-time deployments with no traffic
description: >-
  Delete every deployment on a real-time endpoint that receives no traffic.
  Deployments still provisioning are skipped. Writes a summary of the clean-up.

inputs:
  endpoint-name:
    description: Real-time endpoint name.
    required: true
  resource-group:
    description: Resource group of the workspace.
    required: true
  workspace-name:
    description: Azure ML workspace holding the endpoint.
    required: true

runs:
  using: composite
  steps:
    - name: Delete zero-traffic deployments
      shell: bash
      env:
        RT_ENDPOINT_NAME: ${{ inputs.endpoint-name }}
        RG: ${{ inputs.resource-group }}
        WORKSPACE_NAME: ${{ inputs.workspace-name }}
      run: ${{ github.action_path }}/delete-orphan-rt-deployments.sh
