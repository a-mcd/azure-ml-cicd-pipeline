# Azure ML environment for the real-time and batch endpoints.
#
# Python and the packages shared with pyproject.toml use the same versions as
# CI, so the scoring tests run against what the endpoints run.
# tests/unit/test_dependency_pins.py checks that every pip package here is
# pinned and matches pyproject.toml.
# Rebuild and re-register the endpoint environment (and bump
# TEST_ENDPOINT_ENV_VERSION) after changing this file.
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip<=25.2
  - pip:
      - setuptools==84.2.1
      # Azure ML inference server and runtime packages (endpoint only)
      - azureml-core==1.61.0.post4
      - azureml-inference-server-http==1.4.1
      - azureml-ai-monitoring==1.0.0
      - azureml-fsspec==1.4.0
      # Shared with pyproject.toml; versions must match CI
      - azure-ai-ml==1.32.0
      # azureml-dataprep 5.5.0 (via azureml-fsspec) requires azure-identity<=1.17.0.
      - azure-identity==1.17.0
      # azureml-fsspec 1.4.0 requires fsspec<=2023.10.0; pyproject.toml uses the same.
      - fsspec==2023.10.0
      - xgboost==2.1.1
      - scikit-learn==1.5.2
      - pandas==2.2.2
      - numpy==1.26.4
      - mlflow==2.16.2
      - psutil==7.1.3
name: mlflow-env-custom
